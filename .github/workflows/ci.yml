name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make lint typecheck test check-package VENV=/usr/local

  qt-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aqt: ["25.9.5", "26.8.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y xvfb libegl1
      - run: python -m pip install "aqt==${{ matrix.aqt }}"
      - run: xvfb-run -a env PYTHONPATH=. QTWEBENGINE_DISABLE_SANDBOX=1 python tests/qt_smoke.py
