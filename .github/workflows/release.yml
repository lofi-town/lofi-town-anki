name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make lint test check-package RUN_PYTHON=python

  qt-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        aqt: ["25.9.5", "26.8.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            install -y --no-install-recommends libegl1
      - run: python -m pip install -e '.[dev]' "aqt[qt]==${{ matrix.aqt }}"
      - run: make typecheck RUN_PYTHON=python
      - run: make qt-smoke RUN_PYTHON=python

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]' "aqt[qt]==26.8.1"
      - run: python -m ruff check addon tests scripts
      - run: python -m mypy addon scripts
      - run: python -m pytest
      - run: python scripts/package_addon.py
      - run: python scripts/package_addon.py --check dist/lofi-town.ankiaddon
      - run: python tests/qt_smoke.py

  publish:
    needs: [quality, qt-smoke, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Release tag must use vMAJOR.MINOR.PATCH: {tag}")
          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(
                  f"Release tag {tag} does not match pyproject.toml version {version}"
              )
          PY
      - name: Build and verify package
        run: |
          python scripts/package_addon.py
          python scripts/package_addon.py --check dist/lofi-town.ankiaddon
      - name: Create checksum
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          package = Path("dist/lofi-town.ankiaddon")
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          Path("dist/lofi-town.ankiaddon.sha256").write_text(
              f"{digest}  {package.name}\n",
              encoding="utf-8",
          )
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          title="Lofi Town for Anki ${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/lofi-town.ankiaddon \
              dist/lofi-town.ankiaddon.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/lofi-town.ankiaddon \
              dist/lofi-town.ankiaddon.sha256 \
              --verify-tag \
              --notes-file RELEASE_NOTES.md \
              --title "$title"
          fi
