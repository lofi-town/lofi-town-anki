name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make lint test check-package RUN_PYTHON=python

  qt-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        aqt: ["25.9.5", "26.8.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            install -y --no-install-recommends libegl1
      - run: python -m pip install -e '.[dev]' "aqt[qt]==${{ matrix.aqt }}"
      - run: make typecheck RUN_PYTHON=python
      - run: make qt-smoke RUN_PYTHON=python

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]' "aqt[qt]==26.8.1"
      - run: python -m ruff check addon tests scripts
      - run: python -m mypy addon scripts
      - run: python -m pytest
      - run: python scripts/package_addon.py
      - run: python scripts/package_addon.py --check dist/lofi-town.ankiaddon
      - run: python tests/qt_smoke.py
