name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make lint test check-package RUN_PYTHON=python

  qt-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aqt: ["25.9.5", "26.8.1"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -e '.[dev]' "aqt==${{ matrix.aqt }}"
      - run: make typecheck RUN_PYTHON=python
      - run: env PYTHONPATH=. QT_QPA_PLATFORM=offscreen QTWEBENGINE_DISABLE_SANDBOX=1 QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu python tests/qt_smoke.py
