name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make lint test check-package RUN_PYTHON=python

  qt-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        aqt: ["25.9.5", "26.8.1"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20
          sudo apt-get install -y libegl1 \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20
      - run: python -m pip install -e '.[dev]' "aqt[qt]==${{ matrix.aqt }}"
      - run: make typecheck RUN_PYTHON=python
      - run: make qt-smoke RUN_PYTHON=python
