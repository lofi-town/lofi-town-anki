name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: make lint test check-package RUN_PYTHON=python

  qt-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        aqt: ["25.9.5", "26.8.1"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -e '.[dev]' "aqt[qt]==${{ matrix.aqt }}"
      - run: make typecheck RUN_PYTHON=python
      - run: env PYTHONPATH=. QT_QPA_PLATFORM=offscreen QTWEBENGINE_DISABLE_SANDBOX=1 QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu python tests/qt_smoke.py

  publish:
    needs: [quality, qt-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Release tag must use vMAJOR.MINOR.PATCH: {tag}")
          with Path("pyproject.toml").open("rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(
                  f"Release tag {tag} does not match pyproject.toml version {version}"
              )
          PY
      - name: Build and verify package
        run: |
          python scripts/package_addon.py
          python scripts/package_addon.py --check dist/lofi-town.ankiaddon
      - name: Create checksum
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          package = Path("dist/lofi-town.ankiaddon")
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          Path("dist/lofi-town.ankiaddon.sha256").write_text(
              f"{digest}  {package.name}\n",
              encoding="utf-8",
          )
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          title="Lofi Town for Anki ${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/lofi-town.ankiaddon \
              dist/lofi-town.ankiaddon.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/lofi-town.ankiaddon \
              dist/lofi-town.ankiaddon.sha256 \
              --verify-tag \
              --generate-notes \
              --title "$title"
          fi
